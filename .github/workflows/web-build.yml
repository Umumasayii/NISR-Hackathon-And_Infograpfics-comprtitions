# Checks that the SmartIrrigate Rwanda web app (SCRIPTS/web) still builds.
# Vercel deploys the site itself from master; this check catches a broken build first.
name: Web app build

on:
  push:
    branches: [master]
    paths: ['SCRIPTS/web/**', '.github/workflows/web-build.yml']
  pull_request:
    paths: ['SCRIPTS/web/**', '.github/workflows/web-build.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SCRIPTS/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: SCRIPTS/web/package-lock.json
      - run: npm ci
      - run: npm run build
